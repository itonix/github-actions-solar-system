
name: Testing - Reusable Workflow

on:
  workflow_call:
    inputs:
      ingress-url:
        description: Provide the application base URL
        required: true
        type: string

jobs:
  integration-test:
    runs-on: ubuntu-latest
    steps:
      - name: Test application health
        env:
          URL: ${{ inputs.ingress-url }}
        run: |
          set -euo pipefail

          curl --fail --silent --show-error \
            "$URL/live" \
            | jq -e '.status | test("live"; "i")'
